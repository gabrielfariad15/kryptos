name: kryptos
description: "Kryptos: mensageiro privado da Torion Systems."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  # Exata: e o que entrega os quadros da camera ao leitor (DEPENDENCIAS.md).
  camera: 0.12.2
  kryptos_ponte:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # IBM Plex Mono embutida (licenca OFL-1.1, assets/fonts/OFL-IBM-Plex-Mono.txt).
  # Nada de google_fonts: ele baixaria a fonte de servidor do Google na hora de rodar.
  fonts:
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
