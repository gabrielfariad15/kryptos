# Workspace Rust do Kryptos: um Cargo.lock e um target/ para tudo.
# Membros:
#   nucleo              motor do app (roda no aparelho)
#   protocolo           formato das mensagens entre o app e o relay (usado pelos dois)
#   backend/relay       servidor de repasse
#   frontend/app/rust   ponte fina entre o Flutter e o nucleo (flutter_rust_bridge)
[workspace]
resolver = "3"
members = ["nucleo", "protocolo", "backend/relay", "frontend/app/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

# Versoes registradas em documentacao/DEPENDENCIAS.md (regra 8.6).
[workspace.dependencies]
kryptos_nucleo = { path = "nucleo" }
kryptos_protocolo = { path = "protocolo" }
# Exata: troca de versao da criptografia e decisao, nao efeito colateral de cargo update.
# Sem os padroes: "libolm-compat" (importar conta do libolm) nao tem uso aqui.
vodozemac = { version = "=0.11.2", default-features = false, features = ["precomputed-tables"] }
sha2 = "0.11.0"
# Cofre da identidade (documentacao/arquitetura/cofre-da-identidade.md).
# Crates novos na arvore: argon2 e blake2 (medido com cargo tree); os outros ja vinham pelo vodozemac.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13.0"
zeroize = "1.9.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
# QR do cartao de contato (documentacao/arquitetura/cartao-de-contato.md).
# rxing sem os padroes (com eles, 264 crates): so QR, so leitura, conjunto de caracteres
# pelo encoding_rs. Exata: e o leitor de imagem vinda de fora, troca de versao e decisao.
rxing = { version = "=0.9.3", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }
# Sem os padroes (image, svg, pic): so a grade de modulos, sem crate nenhum a mais.
qrcode = { version = "=0.14.1", default-features = false }
anyhow = "1.0.104"
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Argon2 otimizado tambem no build de debug (o do celular em desenvolvimento): sem
# isso cada tentativa de PIN levaria varios segundos e a medicao sairia errada.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Leitor de QR otimizado tambem no debug: roda em cada quadro da camera, e sem isso o
# tempo medido no celular em desenvolvimento nao seria o do app de verdade.
[profile.dev.package.rxing]
opt-level = 3

# Curva do Ed25519 e do X25519 otimizada tambem no debug. Medido em 07/11/2026, no
# computador: testes do protocolo (2.392 conferencias de assinatura) de 23,17 s para
# 0,19 s; testes do nucleo de 5,74 s para 4,57 s. No celular em desenvolvimento, a
# criptografia fica mais perto da do app de verdade.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Regra 7.1: nada de unwrap/expect em caminho de producao (os testes podem).
unwrap_used = "deny"
expect_used = "deny"
